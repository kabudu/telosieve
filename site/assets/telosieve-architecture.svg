<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title description">
  <title id="title">How Telosieve evaluates a desired-state instruction</title>
  <desc id="description">Goal instructions, corroborated observations, and viability rules remain separate. Telosieve verifies provenance, evaluates declared fault hypotheses, asks an independent checker whether every surviving plan is acceptable, then emits either a bounded certificate or an explicit refusal while retaining evidence.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071018"/><stop offset=".55" stop-color="#101820"/><stop offset="1" stop-color="#17132B"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172A35"/><stop offset="1" stop-color="#17182A"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8DA3AE"/></marker>
  </defs>
  <rect width="1600" height="920" rx="36" fill="url(#background)"/>
  <circle cx="800" cy="450" r="250" fill="#20D9D2" opacity=".05" filter="url(#glow)"/>
  <circle cx="800" cy="450" r="188" fill="#775CFF" opacity=".08" filter="url(#glow)"/>

  <text x="80" y="82" fill="#F7FAFC" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">An instruction has to survive the evidence.</text>
  <text x="80" y="124" fill="#AABAC3" font-family="Inter, Arial, sans-serif" font-size="21">Telosieve keeps authority sources separate, tests what could be wrong, and refuses when the surviving cases do not agree.</text>

  <!-- source cards -->
  <g font-family="Inter, Arial, sans-serif">
    <rect x="70" y="214" width="330" height="146" rx="22" fill="#0E2029" stroke="#5BD6E7" stroke-width="2"/>
    <circle cx="110" cy="258" r="17" fill="#5BD6E7"/><text x="140" y="265" fill="#F7FAFC" font-size="24" font-weight="700">Goal authority</text>
    <text x="110" y="308" fill="#B9C8CF" font-size="18">What the system is being told to do</text><text x="110" y="334" fill="#718995" font-size="15">Authenticated, versioned, still fallible</text>

    <rect x="70" y="392" width="330" height="146" rx="22" fill="#231A10" stroke="#F5B85C" stroke-width="2"/>
    <circle cx="110" cy="436" r="17" fill="#F5B85C"/><circle cx="136" cy="436" r="17" fill="#F5B85C" opacity=".68"/><text x="166" y="443" fill="#F7FAFC" font-size="24" font-weight="700">Observation quorum</text>
    <text x="110" y="486" fill="#D7C9B2" font-size="18">What multiple collectors can corroborate</text><text x="110" y="512" fill="#9D8665" font-size="15">Exact bytes, authenticated fault domains</text>

    <rect x="70" y="570" width="330" height="146" rx="22" fill="#1C1729" stroke="#B9A4F4" stroke-width="2"/>
    <path d="M96 618L110 604L124 618L110 632Z" fill="#B9A4F4"/><text x="140" y="625" fill="#F7FAFC" font-size="24" font-weight="700">Viability authority</text>
    <text x="110" y="668" fill="#C8C0D9" font-size="18">What must remain true after a change</text><text x="110" y="694" fill="#8E82A6" font-size="15">Checked independently from the planner</text>
  </g>

  <!-- bounded incoming paths -->
  <path d="M400 287C470 287 475 338 538 354" fill="none" stroke="#5BD6E7" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M400 465H532" fill="none" stroke="#F5B85C" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M400 643C470 643 475 590 538 572" fill="none" stroke="#B9A4F4" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- core -->
  <rect x="540" y="206" width="520" height="520" rx="42" fill="url(#core)" stroke="#344955" stroke-width="2"/>
  <text x="588" y="258" fill="#91A5AF" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">TELOSIEVE EVALUATION BOUNDARY</text>

  <g font-family="Inter, Arial, sans-serif">
    <circle cx="610" cy="333" r="25" fill="#102F38" stroke="#5BD6E7" stroke-width="2"/><text x="610" y="341" text-anchor="middle" fill="#A6FFF7" font-size="22" font-weight="700">1</text>
    <text x="656" y="324" fill="#F7FAFC" font-size="23" font-weight="700">Verify provenance</text><text x="656" y="352" fill="#AABAC3" font-size="17">identity, signature, lineage, freshness, schema</text>

    <path d="M610 368V400" stroke="#58707C" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="610" cy="433" r="25" fill="#352A16" stroke="#F5B85C" stroke-width="2"/><text x="610" y="441" text-anchor="middle" fill="#FFD47C" font-size="22" font-weight="700">2</text>
    <text x="656" y="424" fill="#F7FAFC" font-size="23" font-weight="700">Test declared fault hypotheses</text><text x="656" y="452" fill="#AABAC3" font-size="17">exclude each suspect authority before planning</text>

    <path d="M610 468V500" stroke="#58707C" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="610" cy="533" r="25" fill="#241D38" stroke="#B9A4F4" stroke-width="2"/><text x="610" y="541" text-anchor="middle" fill="#D4CBFF" font-size="22" font-weight="700">3</text>
    <text x="656" y="524" fill="#F7FAFC" font-size="23" font-weight="700">Check every surviving plan</text><text x="656" y="552" fill="#AABAC3" font-size="17">separate implementation, stable keys, viability, bounds</text>

    <path d="M610 568V600" stroke="#58707C" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="610" cy="633" r="25" fill="#13302C" stroke="#57D7C0" stroke-width="2"/><text x="610" y="641" text-anchor="middle" fill="#9BFFE9" font-size="22" font-weight="700">4</text>
    <text x="656" y="624" fill="#F7FAFC" font-size="23" font-weight="700">Require unanimous surviving agreement</text><text x="656" y="652" fill="#AABAC3" font-size="17">ambiguity, missing evidence, or disagreement refuses</text>
  </g>

  <!-- output paths -->
  <path d="M1060 398C1115 398 1122 329 1170 329" fill="none" stroke="#57D7C0" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1060 534C1115 534 1122 601 1170 601" fill="none" stroke="#FF8F85" stroke-width="4" marker-end="url(#arrow)"/>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="1172" y="245" width="358" height="170" rx="24" fill="#102A27" stroke="#57D7C0" stroke-width="2"/>
    <rect x="1214" y="286" width="38" height="38" transform="rotate(12 1233 305)" fill="#57D7C0"/><text x="1280" y="309" fill="#F7FAFC" font-size="26" font-weight="700">Bounded certificate</text>
    <text x="1214" y="354" fill="#B8D5CF" font-size="18">The exact evidence and agreed result</text><text x="1214" y="381" fill="#789B93" font-size="15">Target remains unchanged in evaluation modes</text>

    <rect x="1172" y="517" width="358" height="170" rx="24" fill="#2B171B" stroke="#FF8F85" stroke-width="2"/>
    <path d="M1216 561L1250 595M1250 561L1216 595" stroke="#FF8F85" stroke-width="9" stroke-linecap="round"/><text x="1280" y="585" fill="#F7FAFC" font-size="26" font-weight="700">Explicit refusal</text>
    <text x="1214" y="626" fill="#D7B8BF" font-size="18">No guessed repair and no silent fallback</text><text x="1214" y="653" fill="#9C747E" font-size="15">The negative result remains inspectable</text>
  </g>

  <!-- evidence floor -->
  <path d="M800 726V766" stroke="#718995" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="405" y="770" width="790" height="92" rx="22" fill="#0C171E" stroke="#344955" stroke-width="2"/>
  <g font-family="Inter, Arial, sans-serif"><text x="450" y="812" fill="#F7FAFC" font-size="21" font-weight="700">Retained evidence</text><text x="450" y="838" fill="#91A5AF" font-size="16">inputs · hypotheses · exclusions · checker results · certificate or refusal · durable history anchors</text><text x="1125" y="821" text-anchor="end" fill="#57D7C0" font-size="15" font-weight="700" letter-spacing="1.5">INSPECTABLE BY DESIGN</text></g>
</svg>
