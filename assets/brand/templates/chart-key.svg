<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title description"><title id="title">Telosieve chart key</title><desc id="description">Canonical chart styles that retain accepted, refused, unsupported, and uncertain outcomes.</desc><rect width="720" height="220" fill="#FFFFFF"/><g font-family="Arial, sans-serif" font-size="16" fill="#101820"><rect x="44" y="42" width="70" height="70" rx="5" fill="#006B5F"/><text x="44" y="140">Verified</text><rect x="194" y="42" width="70" height="70" rx="5" fill="#B42318"/><path d="M207 55L251 99M251 55L207 99" stroke="#FFFFFF" stroke-width="7"/><text x="194" y="140">Refused</text><rect x="344" y="42" width="70" height="70" rx="5" fill="#475467"/><path d="M354 77H404" stroke="#FFFFFF" stroke-width="7" stroke-dasharray="8 7"/><text x="338" y="140">Unsupported</text><rect x="514" y="42" width="70" height="70" rx="5" fill="#8A4B08"/><text x="535" y="92" fill="#FFFFFF" font-size="40" font-weight="700">?</text><text x="514" y="140">Uncertain</text><text x="44" y="188" fill="#475467">Show denominators, exclusions, timeouts, missing data, and confidence explicitly.</text></g></svg>
