<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title description"><title id="title">Telosieve diagram key</title><desc id="description">Canonical diagram shapes for authorities, evidence, verification boundaries, bounded processes, results, and refusals.</desc><rect width="720" height="220" fill="#FFFFFF"/><g font-family="Arial, sans-serif" font-size="16" fill="#101820"><circle cx="64" cy="70" r="24" fill="#007C91"/><text x="32" y="120">Authority</text><path d="M150 70H214" stroke="#6B4BB6" stroke-width="8" stroke-linecap="round"/><text x="154" y="120">Evidence</text><rect x="280" y="38" width="56" height="64" rx="8" fill="none" stroke="#101820" stroke-width="6"/><text x="266" y="120">Boundary</text><rect x="390" y="46" width="88" height="48" rx="8" fill="#F7FAFC" stroke="#475467" stroke-width="3"/><text x="398" y="120">Process</text><rect x="536" y="54" width="32" height="32" rx="5" fill="#006B5F"/><text x="526" y="120">Result</text><path d="M642 48L682 92M682 48L642 92" stroke="#B42318" stroke-width="8"/><text x="636" y="120">Refusal</text><text x="32" y="180" fill="#475467">Labels and shapes remain mandatory; colour alone never carries state.</text></g></svg>
