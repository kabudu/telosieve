<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Telosieve product card</title>
  <desc id="description">Dark product card showing the Telosieve cut-sieve glyph beside the product name and enduring product promise.</desc>
  <rect width="1200" height="630" fill="#101820"/>
  <g transform="translate(96 170) scale(1.8)">
    <path d="M30 10H120L148 38V122L120 150H30L12 132V28ZM48 34H105L120 49L105 64H71L61 74L71 84H120V103H64L37 76L64 49H98L103 44L98 39H48Z" fill="#F7FAFC" fill-rule="evenodd"/>
    <circle cx="31" cy="45" r="6" fill="#5BD6E7"/><circle cx="31" cy="76" r="6" fill="#F5B85C"/><circle cx="31" cy="107" r="6" fill="#B9A4F4"/><rect x="123" y="109" width="14" height="14" rx="2" fill="#57D7C0"/>
  </g>
  <text x="430" y="265" fill="#F7FAFC" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="700" letter-spacing="-3">Telosieve</text>
  <text x="436" y="330" fill="#57D7C0" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="1.1">QUESTION THE INSTRUCTION BEFORE ENFORCING IT</text>
  <line x1="436" y1="380" x2="1090" y2="380" stroke="#475467" stroke-width="2"/>
  <text x="436" y="435" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="27">Corroborated control for desired-state systems</text>
  <text x="436" y="480" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="22">Evidence before confidence. Refusal is a valid result.</text>
</svg>
