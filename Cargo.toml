[package]
name = "telosieve"
version = "0.2.0-rc.2"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
ed25519-dalek = "2.2.0"
hex = "0.4.3"
serde = { version = "1.0.219", features = ["derive"] }
