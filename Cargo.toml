[package]
name = "telosieve"
version = "0.2.0-rc.2"
edition = "2024"
rust-version = "1.97"
description = "Fail-closed evaluation of desired-state instructions under disputed authority"
license = "Apache-2.0"
repository = "https://github.com/kabudu/telosieve"
homepage = "https://github.com/kabudu/telosieve"
readme = "README.md"
keywords = ["security", "verification", "kubernetes", "opentofu", "reconciliation"]
categories = ["command-line-utilities", "development-tools", "config"]
publish = false

[dependencies]
ed25519-dalek = "2.2.0"
hex = "0.4.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sha2 = "0.10.9"
thiserror = "2.0.12"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
